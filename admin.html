<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>INNIE — Publishing</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">
  <header class="site-header">
    <a class="wordmark" href="index.html">INNIE</a>
    <span class="admin-label">Publishing</span>
  </header>
  <main class="admin-main">
    <section id="login-panel" class="admin-panel narrow">
      <p class="eyebrow">INNIE ADMIN</p><h1>Publish something new.</h1>
      <p>Only you should have access to this area. Your password is never stored in the page.</p>
      <form id="login-form"><label for="admin-password">Admin password</label><input id="admin-password" type="password" autocomplete="current-password" required /><button type="submit">Sign in</button><p class="admin-note" id="login-note"></p></form>
    </section>
    <section id="editor-panel" class="admin-panel" hidden>
      <div class="admin-heading"><div><p class="eyebrow">PUBLISHING</p><h1 id="editor-title">Add a product or service</h1><p>Published items appear automatically on the INNIE landing page and get their own detail page.</p></div><a class="text-link" href="index.html">View site →</a></div>
      <div id="published-list" class="published-list"></div>
      <form id="product-form" class="product-form">
        <input type="hidden" name="editingSlug" />
        <div class="form-grid">
          <label>Name<input name="name" required placeholder="Product or service name" /></label>
          <label>Type<select name="type"><option value="product">Product</option><option value="service">Service</option></select></label>
          <label>Status<select name="status"><option>Coming Soon</option><option>Live</option></select></label>
          <label>Launch URL<input name="appUrl" type="url" placeholder="https://..." /></label>
        </div>
        <label>Short description<input name="shortDescription" maxlength="160" required placeholder="One clear sentence." /></label>
        <label>Full description<textarea name="description" rows="6" required placeholder="Explain what this product or service is, who it is for, and why it matters."></textarea></label>
        <div class="upload-grid"><label class="upload-box"><span>Hero image / logo</span><input id="hero" type="file" accept="image/png,image/jpeg,image/webp,image/gif" /><small>PNG, JPG, WebP or GIF · max 3 MB</small></label><label class="upload-box"><span>Screenshots</span><input id="screenshots" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple /><small>Up to 12 images · max 3 MB each</small></label></div>
        <div id="preview" class="preview-grid"></div>
        <div class="publish-row"><button type="submit" id="publish-button">Publish product/service</button><button type="button" id="cancel-edit" class="secondary" hidden>Cancel edit</button><p class="admin-note" id="publish-note"></p></div>
      </form>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
