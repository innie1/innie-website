<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="INNIE product or service details." />
  <title>INNIE — Product</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .detail{padding:40px 0 70px}.back{display:inline-block;color:#7d858d;font-size:12px;margin-bottom:40px}.detail-hero{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:58px;align-items:start}.detail-media{aspect-ratio:4/3;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:#fafbfc}.detail-media img{width:100%;height:100%;object-fit:cover}.detail-placeholder{color:#b0b6bc;font-size:12px}.detail h1{font-size:clamp(34px,6vw,64px);line-height:1;letter-spacing:-.045em;margin:0 0 14px}.detail-summary{font-size:17px;color:var(--muted);max-width:620px;margin:0 0 20px}.detail-status{font-size:12px;color:#7d858d}.detail-section{border-top:1px solid var(--line);margin-top:64px;padding-top:30px}.detail-section h2{font-size:24px;margin:0 0 16px}.detail-section p{color:var(--muted);max-width:760px}.screenshots{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.screenshots figure{margin:0;border:1px solid var(--line);aspect-ratio:16/10;overflow:hidden;background:#fafbfc}.screenshots img{width:100%;height:100%;object-fit:cover}.related{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-left:1px solid var(--line)}.related a{border-right:1px solid var(--line);border-top:1px solid var(--line);padding:22px}.related strong{display:block;margin-bottom:5px}.related span{font-size:12px;color:var(--muted)}.launch{display:inline-flex;margin-top:24px;background:var(--blue-strong);color:#fff;padding:12px 18px;font-size:13px;font-weight:600}.launch:hover{background:#4fa1e2}@media(max-width:700px){.detail{padding-top:28px}.detail-hero{grid-template-columns:1fr;gap:28px}.screenshots{grid-template-columns:1fr}.related{grid-template-columns:1fr}.detail-section{margin-top:45px}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html">INNIE</a>
    <nav><a href="index.html#products">Products &amp; Services</a><a href="index.html#contact">Contact Us</a></nav>
  </header>
  <main class="detail" id="detail"></main>
  <footer class="site-footer"><span class="footer-mark">I</span><p>INNIE Group — building what comes next.</p><a href="mailto:hello@innie.group">hello@innie.group</a></footer>
  <script src="product.js"></script>
</body>
</html>
